# craft.conf — Project-level orchestrator configuration

# Operator name — used in skill prompts and notifications.
# Defaults to git user.name or $USER if not set here.
# OPERATOR_NAME=

# GitHub username — used as PR reviewer.
# Defaults to `gh api user -q .login` if not set here.
# GITHUB_REVIEWER=

# Branch prefix for task branches (e.g. "sls/" → "sls/feat/add-widget").
# Leave empty for no prefix.
# BRANCH_PREFIX=

# Agent provider for task execution. Each task can override this
# with an `agent:` field in its YAML frontmatter.
# Codex is the default coding agent; cross-model review (via the
# orchestrator-skills plugin) farms self-review out to a Claude sub-agent.
DEFAULT_AGENT=codex

# Agent provider for the architect session (the interactive planning window)
ARCHITECT_AGENT=claude

# Terminal multiplexer: tmux (default) or cmux
# MULTIPLEXER=tmux

# Provider-specific approval mode. Sets how much autonomy the agent gets.
# Variable name follows the pattern: <PROVIDER>_APPROVAL_MODE
#
# Codex modes:
#   bypass     — no approvals, no sandbox (--dangerously-bypass-approvals-and-sandbox)
#   never      — no approvals, still sandboxed (-a never)
#   full-auto  — model decides when to ask, sandboxed (--full-auto)
#   on-request — model decides when to ask (default codex behavior)
#   untrusted  — only trusted commands run without approval
#
# Claude modes:
#   bypass     — no approvals (--dangerously-skip-permissions)
#   full-auto  — same as bypass for claude
#
# CODEX_APPROVAL_MODE=bypass
# CLAUDE_APPROVAL_MODE=

# Agent timeout in seconds. Tasks exceeding this are moved to blocked.
# Leave commented out for no timeout. Per-task override via `timeout:` in frontmatter.
# AGENT_TIMEOUT=3600

# --- Plugins ---
# Comma-separated list of enabled plugins from plugins/.
# Each plugin provides hooks for lifecycle events (on_waiting, on_ready, etc.)
# Plugins may also declare QUEUE_STATES in plugin.conf and expose symlinked
# project assets from plugins/<name>/project/.
# PLUGINS=

# slack-daily-thread plugin configuration
#
# Posts PR notifications to a daily Slack thread.
# Requires the slack-bot scripts at SLACK_BOT_PATH.

# Slack channel ID to post to
SLACK_CHANNEL=""

# Path to the slack-bot scripts directory (must contain post.sh and pr-thread-cache.sh)
SLACK_BOT_PATH=""

# Comma-separated list of repo names to post PRs for (e.g. "content-moderation,trust-tools")
# If empty, posts for all repos (minus any excluded).
SLACK_DAILY_THREAD_REPOS=""

# Comma-separated list of repo names to exclude (e.g. "trust-tools")
# Applied after the allow list. If REPOS is empty, this excludes from "all".
SLACK_DAILY_THREAD_REPOS_EXCLUDE=""

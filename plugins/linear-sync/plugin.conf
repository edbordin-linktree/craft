# linear-sync plugin configuration
#
# Syncs Linear issues into the craft task queue and pushes status updates back.
# Uses schpet/linear-cli, which installs a `linear` binary.
#
# macOS/Homebrew:
#   brew install schpet/tap/linear
#
# Linux without sudo:
#   mkdir -p "$HOME/.local/bin" "$HOME/.local/src/linear-cli"
#   cd "$HOME/.local/src/linear-cli"
#   curl -fsSLO https://github.com/schpet/linear-cli/releases/download/v2.0.0/linear-aarch64-unknown-linux-gnu.tar.xz
#   curl -fsSLO https://github.com/schpet/linear-cli/releases/download/v2.0.0/linear-aarch64-unknown-linux-gnu.tar.xz.sha256
#   sha256sum -c linear-aarch64-unknown-linux-gnu.tar.xz.sha256
#   tar -xJf linear-aarch64-unknown-linux-gnu.tar.xz
#   install -m 0755 linear-aarch64-unknown-linux-gnu/linear "$HOME/.local/bin/linear"
#
# For x86_64 Linux, replace `aarch64` with `x86_64`.
# Do not use the npm package named `linear`; it is unrelated.
# If another `linear` is first in PATH, set this to the absolute path.
LINEAR_BIN="linear"

# Linear project to sync from (required)
LINEAR_PROJECT=""

# Linear team (optional — defaults to the CLI's configured default team)
LINEAR_TEAM=""

# Linear workspace (optional — defaults to the CLI's configured default workspace)
LINEAR_WORKSPACE=""

# Trigger condition: which Linear workflow state means "ready to be picked up
# by craft". schpet/linear-cli accepts workflow state types here:
# triage, backlog, unstarted, started, completed, canceled.
LINEAR_READY_STATE="unstarted"

# Linear state to set when craft starts working on a task
LINEAR_IN_PROGRESS_STATE="started"

# Linear state to set when the PR is waiting for review
LINEAR_WAITING_STATE="started"

# Linear state to set when the task is done (PR merged)
LINEAR_DONE_STATE="completed"

# Linear state to set when the task is blocked. Leave blank to only add a
# blocked comment, since Linear does not have a portable "blocked" state type.
LINEAR_BLOCKED_STATE=""

# Assignee filter — only sync issues assigned to this user (blank = any assignee)
# Use "self" for the authenticated user, or a username
LINEAR_ASSIGNEE=""

# Label filter — only sync issues with this label (blank = no label filter)
LINEAR_LABEL=""

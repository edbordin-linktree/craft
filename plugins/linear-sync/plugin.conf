# linear-sync plugin configuration
#
# Syncs Linear issues into the craft task queue and pushes status updates back.
# Uses `linear-cli` — must be installed and authenticated.

# Linear project to sync from (required)
LINEAR_PROJECT=""

# Linear team (optional — defaults to your linear-cli default team)
LINEAR_TEAM=""

# Linear workspace (optional — defaults to your linear-cli default workspace)
LINEAR_WORKSPACE=""

# Trigger condition: which Linear state means "ready to be picked up by craft"
# This maps to Linear workflow states (e.g. "Ready", "Todo", "In Progress")
LINEAR_READY_STATE="Ready"

# Linear state to set when craft starts working on a task
LINEAR_IN_PROGRESS_STATE="In Progress"

# Linear state to set when the PR is waiting for review
LINEAR_WAITING_STATE="In Review"

# Linear state to set when the task is done (PR merged)
LINEAR_DONE_STATE="Done"

# Linear state to set when the task is blocked
LINEAR_BLOCKED_STATE="Blocked"

# Assignee filter — only sync issues assigned to this user (blank = any assignee)
# Use "self" for the authenticated user, or a username
LINEAR_ASSIGNEE=""

# Label filter — only sync issues with this label (blank = no label filter)
LINEAR_LABEL=""

# orchestrator-skills/plugin.conf
#
# Configuration for the orchestrator-skills plugin.
# Project assets under project/ are synced by Craft core into each enabled
# project as symlinks.

# Extra task queue states provided by this plugin.
QUEUE_STATES=diffhub-review

# Devin API key. Required for delegate-to-devin to work.
# Recommend setting via env (DEVIN_API_KEY) rather than here.
# DEVIN_API_KEY=

# Devin org id (enterprise only).
# DEVIN_ORG_ID=

# Default ACU limit per Devin session — guardrail against runaway cost.
DEVIN_ACU_LIMIT=10

# How long to poll Devin sessions before giving up (seconds).
DEVIN_POLL_TIMEOUT=3600

# Poll interval for Devin session status (seconds).
DEVIN_POLL_INTERVAL=20
